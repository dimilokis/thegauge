<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gauge — Social Kit</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080808;
  --surface:  #0f0f0f;
  --lift:     #161616;
  --border:   #1f1f1f;
  --border2:  #2a2a2a;
  --text:     #e8e4dc;
  --muted:    #5a5650;
  --dim:      #3a3632;
  --gold:     #c9a96e;
  --gold-dim: rgba(201,169,110,0.08);
  --gold-mid: rgba(201,169,110,0.18);
  --ice:      #7eb8c9;
  --heat:     #c97a6e;
  --green:    #7ec998;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-weight: 300; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }

nav { display: flex; justify-content: space-between; align-items: center; padding: 24px 48px; border-bottom: 1px solid var(--border); }
.nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; color: var(--text); text-decoration: none; }
.nav-logo span { color: var(--gold); }
.nav-back { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .2s; }
.nav-back:hover { color: var(--gold); }

.wrap { max-width: 1160px; margin: 0 auto; padding: 44px 48px 90px; }
.page-head { max-width: 640px; margin-bottom: 40px; }
.section-eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 48px); font-weight: 300; line-height: 1.1; letter-spacing: -0.5px; margin-bottom: 14px; }
h1 em { font-style: italic; color: var(--gold); }
.page-sub { font-size: 14.5px; color: var(--muted); line-height: 1.75; max-width: 560px; }

.kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; margin-bottom: 44px; }
.kit-card { border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.kit-card img { width: 100%; display: block; }
.kit-card-body { padding: 16px; }
.kit-caption { font-size: 13px; color: var(--muted); line-height: 1.6; white-space: pre-wrap; margin: 12px 0 14px; }
.copy-btn { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 9px 18px; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; width: 100%; }
.copy-btn:hover { background: var(--gold-dim); }
.copy-btn.copied { border-color: var(--green); color: var(--green); }
.copy-btn.failed { border-color: var(--heat); color: var(--heat); }
.empty-box { border: 1px solid var(--border); background: var(--surface); padding: 60px 20px; text-align: center; color: var(--muted); font-size: 13.5px; max-width: 640px; }

footer { border-top: 1px solid var(--border); padding: 32px 48px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--dim); letter-spacing: .5px; }
footer a { color: var(--dim); text-decoration: none; }
footer a:hover { color: var(--muted); }

@media(max-width: 820px) {
  nav { padding: 18px 24px; }
  .wrap { padding: 28px 20px 60px; }
  footer { flex-direction: column; gap: 12px; padding: 28px 24px; text-align: center; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">The <span>Gauge</span></a>
  <a class="nav-back" href="dashboard.html">← Dashboard</a>
</nav>

<div class="wrap">
  <div class="page-head">
    <p class="section-eyebrow">Social Kit</p>
    <h1 class="serif">Today's <em>outliers,</em><br>ready to share.</h1>
    <p class="page-sub" id="pageSub">One card per coin that moved statistically extreme and independent of Bitcoin today. Generated automatically, updated once a day.</p>
  </div>

  <div id="kitGrid" class="kit-grid"></div>
</div>

<footer>
  <span>© 2026 The Gauge — gauging the market is an art.</span>
  <a href="https://thegauge.gumroad.com/l/mkmzrq">Other research</a>
  <a href="mailto:hello@thegauge.art">hello@thegauge.art</a>
</footer>

<script>
function caption(a){
  return a.symbol + ' — ' + Math.abs(a.sigma).toFixed(1) + 'σ move, only ' + a.from_btc_pct
    + '% explained by BTC. ' + a.verdict + '.\n\nhttps://thegauge.art\n#' + a.symbol + ' #crypto #Bitcoin';
}

function flashBtn(btn, ok, okLabel){
  const original = btn.dataset.label;
  btn.classList.remove('copied', 'failed');
  btn.classList.add(ok ? 'copied' : 'failed');
  btn.textContent = ok ? okLabel : "Couldn't copy — try again";
  setTimeout(() => { btn.classList.remove('copied', 'failed'); btn.textContent = original; }, 1800);
}

async function copyImage(btn, url){
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    flashBtn(btn, true, 'Image copied!');
  } catch (e) {
    console.warn('copy image failed:', e);
    flashBtn(btn, false);
  }
}

async function copyText(btn, text){
  try {
    await navigator.clipboard.writeText(text);
    flashBtn(btn, true, 'Text copied!');
  } catch (e) {
    console.warn('copy text failed:', e);
    flashBtn(btn, false);
  }
}

fetch('social/latest.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(m => {
    const grid = document.getElementById('kitGrid');
    const dateStr = m.date;
    document.getElementById('pageSub').textContent =
      (m.assets.length ? m.assets.length + ' coin(s) stood out on ' : 'No outliers on ') + dateStr + '.';

    if (!m.assets.length) {
      grid.innerHTML = '<div class="empty-box">Nothing statistically extreme and independent of Bitcoin that day — a quiet day, no cards generated.</div>';
      return;
    }

    grid.innerHTML = m.assets.map((a, i) => {
      const imgUrl = 'social/' + dateStr + '/' + a.file;
      const txt = caption(a);
      return '<div class="kit-card">'
        + '<img src="' + imgUrl + '" alt="' + a.symbol + '">'
        + '<div class="kit-card-body">'
        + '<button class="copy-btn" data-label="Copy image" data-idx="' + i + '" data-action="img">Copy image</button>'
        + '<p class="kit-caption">' + txt.replace(/</g, '&lt;') + '</p>'
        + '<button class="copy-btn" data-label="Copy text" data-idx="' + i + '" data-action="txt">Copy text</button>'
        + '</div></div>';
    }).join('');

    grid.querySelectorAll('.copy-btn').forEach(btn => {
      btn.textContent = btn.dataset.label;
      const a = m.assets[+btn.dataset.idx];
      if (btn.dataset.action === 'img') {
        btn.addEventListener('click', () => copyImage(btn, 'social/' + dateStr + '/' + a.file));
      } else {
        btn.addEventListener('click', () => copyText(btn, caption(a)));
      }
    });
  })
  .catch(e => {
    document.getElementById('kitGrid').innerHTML = '<div class="empty-box">Couldn\'t load the social kit right now.</div>';
    console.warn('social kit fetch failed:', e);
  });
</script>
</body>
</html>
