name: Update Gauge snapshot

on:
  schedule:
    - cron: "7 * * * *"   # todo hora, no minuto 7 (evita o rush de cron no minuto 0)
  workflow_dispatch: {}    # permite rodar manualmente no botao "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gauge_live.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python gauge_live.py

      - name: Commit updated snapshot
        run: |
          git config user.name "gauge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gauge_live.json alert_state.json
          git diff --cached --quiet || git commit -m "chore: refresh gauge snapshot"
          git push
