name: Update Gauge snapshot

on:
  schedule:
    # a cada 15min, offset de 7min (evita o rush de cron no minuto 0/15/30/45).
    # Nota 13/jul: apos a troca de 1h->15min o agendador do GitHub ficou 4+ slots
    # sem disparar; esta edicao re-registra o schedule (remedio conhecido).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}    # permite rodar manualmente no botao "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gauge_live.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python gauge_live.py

      - name: Commit updated snapshot
        run: |
          git config user.name "gauge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gauge_live.json alert_state.json coin_meta_cache.json docs/social
          if git diff --cached --quiet; then
            echo "Nada novo pra commitar nesta run."
            exit 0
          fi
          git commit -m "chore: refresh gauge snapshot"
          # retry com rebase: se outro commit (deploy manual, outra run) chegou em
          # main entre o checkout e aqui, o push simples e rejeitado (nao-fast-forward)
          # e a run falhava silenciosa, sem novo snapshot -- achado 13/jul.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (tentativa $i/5) -- rebase e tenta de novo."
            git fetch origin main
            git rebase origin/main
          done
          echo "Push falhou apos 5 tentativas." >&2
          exit 1
