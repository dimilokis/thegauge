name: Daily social cards

on:
  schedule:
    - cron: "20 13 * * *"   # 1x/dia, 20min depois do refresh das 13:07 UTC (~10:20 Brasilia)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render cards do dia
        run: python marketing/render_cards.py

      - name: Commit e publica (se algum card foi gerado)
        id: commit
        run: |
          TODAY=$(date -u +%F)
          if [ -d "docs/social/$TODAY" ]; then
            N=$(ls docs/social/"$TODAY"/*.png 2>/dev/null | wc -l)
            git config user.name "gauge-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/social/"$TODAY"
            git diff --cached --quiet || git commit -m "chore: cards sociais do dia ($TODAY, $N moedas)"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "url=https://thegauge.art/social/$TODAY/" >> "$GITHUB_OUTPUT"
            echo "n=$N" >> "$GITHUB_OUTPUT"
          else
            echo "Dia 'quiet' — nenhum outlier, nenhum card gerado."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisa no Telegram (opcional, pessoal)
        if: steps.commit.outputs.published == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python marketing/notify_telegram.py "${{ steps.commit.outputs.url }}" "${{ steps.commit.outputs.n }}"
